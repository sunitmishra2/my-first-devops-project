name: Build, Test, and Deploy Website

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: my-devops-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Test container
        env:
          IMAGE_TAG: my-devops-site:${{ github.sha }}
        run: |
          set -euo pipefail

          container_id=$(docker run -d --name test-web -p 8080:80 "${IMAGE_TAG}")
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
            docker rm "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error --retry 3 --retry-delay 1 http://localhost:8080/ > /tmp/website-response.html; then
              break
            fi
            if [[ "${attempt}" == "10" ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done

          if ! grep -q "Namaste" /tmp/website-response.html; then
            echo "The served website did not contain the expected content." >&2
            exit 1
          fi

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
